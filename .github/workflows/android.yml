name: Android

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android-app/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a signed release APK"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-app

env:
  # Public build configuration from repository *variables* (Settings → Secrets and variables → Actions → Variables);
  # without them the deployed API addresses are used (they are public, not secrets).
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://association-api.yacincianai31.workers.dev/' }}
  API_FALLBACK_URLS: ${{ vars.API_FALLBACK_URLS || 'https://association-gateway.pages.dev/' }}
  FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
  FIREBASE_APP_ID_DEBUG: ${{ vars.FIREBASE_APP_ID_DEBUG }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package (the action's default) no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew --stacktrace :app:testDebugUnitTest :admin:testDebugUnitTest :stats:testDebugUnitTest :statsadmin:testDebugUnitTest :statsmember:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug :admin:lintDebug :stats:lintDebug :statsadmin:lintDebug :statsmember:lintDebug
      - name: Assemble debug APKs (members + supervisors)
        run: ./gradlew :app:assembleDebug :admin:assembleDebug -PVERSION_CODE=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/admin/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Census APKs (optimised, signed with the debug key — for testing)
        run: |
          ./gradlew :statsadmin:assembleStaging :statsmember:assembleStaging -PVERSION_CODE=${{ github.run_number }}
          mkdir -p out
          cp statsadmin/build/outputs/apk/staging/statsadmin-staging.apk out/association-statistics-admin.apk
          cp statsmember/build/outputs/apk/staging/statsmember-staging.apk out/association-statistics-member.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Fails the job if a file is missing, unsigned or not the expected application.
          for apk in out/*.apk; do "$BT/apksigner" verify "$apk"; done
          "$BT/aapt2" dump badging out/association-statistics-admin.apk | grep "package: name='dz.association.stats.admin.debug'"
          "$BT/aapt2" dump badging out/association-statistics-member.apk | grep "package: name='dz.association.stats.member.debug'"
          sha256sum out/*.apk | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-apks
          path: |
            android-app/out/association-statistics-admin.apk
            android-app/out/association-statistics-member.apk
            android-app/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            android-app/*/build/reports/tests/
            android-app/*/build/reports/lint-results-debug.html
            android-app/*/build/screenshots/
          retention-days: 7

  release:
    # Signed release builds only for version tags (v1.2.3) or an explicit manual run.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package (the action's default) no longer exists in the SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Version from tag
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$GITHUB_REF" == refs/tags/v* ]]; then NAME="0.0.${{ github.run_number }}"; fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
      - name: Assemble signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :admin:assembleRelease :statsadmin:assembleRelease :statsmember:assembleRelease -PVERSION_NAME=$VERSION_NAME -PVERSION_CODE=$VERSION_CODE
      - name: Verify signature and checksum
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for pair in "app/build/outputs/apk/release/app-release.apk:association-$VERSION_NAME.apk" "admin/build/outputs/apk/release/admin-release.apk:association-admin-$VERSION_NAME.apk" \
                      "statsadmin/build/outputs/apk/release/statsadmin-release.apk:association-statistics-admin-$VERSION_NAME.apk" "statsmember/build/outputs/apk/release/statsmember-release.apk:association-statistics-member-$VERSION_NAME.apk"; do
            APK="${pair%%:*}"; OUT="${pair##*:}"
            test -f "$APK" || { echo "::error::$APK is not signed (check signing secrets)"; exit 1; }
            "$BT/apksigner" verify --print-certs "$APK"
            cp "$APK" "$OUT"
            sha256sum "$OUT" | tee "$OUT.sha256"
          done
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android-app/association-*.apk
            android-app/association-*.apk.sha256
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/association-*.apk
            android-app/association-*.apk.sha256
          generate_release_notes: true
